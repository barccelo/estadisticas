<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administración · Club Deportivo</title>
</head>
<body>
<script>
(async()=>{
  try{
    const response=await fetch('../index.html?admin='+Date.now(),{cache:'no-store'});
    if(!response.ok) throw new Error('No se pudo cargar la administración.');
    let html=await response.text();
    html=html.replace('<head>','<head><base href="../">');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<p style="font-family:system-ui;padding:24px">No se pudo cargar la administración.</p>';
  }
})();
</script>
</body>
</html>
